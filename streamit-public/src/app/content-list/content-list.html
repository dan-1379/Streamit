<h2 class="h4 mb-3">Browse</h2>

<div class="content-grid">
  @for (item of contentItems; track item._id) {
    <a href="/title/{{ item._id }}" class="netflix-card d-block text-decoration-none">
      <img [src]="'http://localhost:3000' + item.image" [alt]="item.title" class="rounded-1 w-100" loading="lazy">
    </a>
  }
</div>
