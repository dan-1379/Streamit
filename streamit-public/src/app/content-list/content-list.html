<h2 class="h4 mb-3">Browse</h2>

<div class="content-grid">
  @for (item of contentItems; track item._id) {
    <a class="content-card d-block text-decoration-none text-white" href="/title/{{ item._id }}">
      <img class="img-fluid rounded" [src]="'http://localhost:3000' + item.image" [alt]="item.title">
      <h3 class="h6 mt-2 mb-1">{{ item.title }}</h3>
      <p class="small text-secondary mb-1">{{ item.year }} · {{ item.seasons }} · {{ item.rating }}</p>
      <p class="small mb-1">{{ item.description }}</p>
      <p class="small text-secondary">
        Starring:
        @for (member of item.cast; track member.name) {
          <span>{{ member.name }} </span>
        }
      </p>
    </a>
  }
</div>
